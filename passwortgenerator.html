<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passwort-Generator: sichere Passwörter erstellen (kostenlos, im Browser)</title>
<meta name="description" content="Sicheres Zufallspasswort erzeugen: Länge, Groß-/Kleinbuchstaben, Zahlen und Sonderzeichen wählbar. Das Passwort entsteht nur in deinem Browser und wird nirgends gespeichert.">
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;padding:16px;color:#222;line-height:1.5}input[type=text]{width:100%;padding:10px;font-family:monospace;font-size:1.1rem;box-sizing:border-box}button{padding:8px 14px;margin:6px 6px 6px 0;cursor:pointer}.box{background:#f3f6fa;border-radius:8px;padding:12px;margin:12px 0}.werbung{background:#fff6e0;border:1px solid #f0d28a}label{display:block}</style></head><body>
<p><a href="/">← Alle Tools</a></p>
<h1>Passwort-Generator</h1>
<p>Das Passwort wird mit dem Zufallsgenerator deines Browsers erzeugt und verlässt deinen Rechner nicht.</p>
<input type="text" id="pw" readonly>
<button id="neu">Neues Passwort</button><button id="kop">Kopieren</button>
<div class="box"><label>Länge: <input type="number" id="len" min="8" max="64" value="20" style="width:70px"></label>
<label><input type="checkbox" id="gro" checked> Großbuchstaben</label><label><input type="checkbox" id="kle" checked> Kleinbuchstaben</label>
<label><input type="checkbox" id="zah" checked> Zahlen</label><label><input type="checkbox" id="son" checked> Sonderzeichen</label></div>
<p id="st"></p>
<div class="box werbung"><strong>Mehr Ordnung im Alltag:</strong> Haushaltsbuch, Abo-Tracker und Kündigungsvorlagen: <a href="https://payhip.com/KlartextVorlagen" rel="noopener">zum Shop von Klartext Vorlagen</a>.</div>
<script>
const $=id=>document.getElementById(id);
function zuf(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function gen(){const s=[["gro","ABCDEFGHJKLMNPQRSTUVWXYZ"],["kle","abcdefghijkmnopqrstuvwxyz"],["zah","23456789"],["son","!@#$%&*?+-_="]].filter(x=>$(x[0]).checked).map(x=>x[1]);
if(!s.length){$("pw").value="";$("st").textContent="Bitte mindestens eine Zeichenart wählen.";return}
const len=Math.min(64,Math.max(8,+$("len").value||20));const alle=s.join("");let p=s.map(g=>g[zuf(g.length)]);
while(p.length<len)p.push(alle[zuf(alle.length)]);
for(let i=p.length-1;i>0;i--){const j=zuf(i+1);[p[i],p[j]]=[p[j],p[i]]}
$("pw").value=p.join("");const bits=Math.round(len*Math.log2(alle.length));$("st").textContent="Etwa "+bits+" Bit Stärke ("+(bits>=80?"sehr stark":bits>=60?"stark":"eher schwach")+")."}
$("neu").onclick=gen;["len","gro","kle","zah","son"].forEach(i=>$(i).onchange=gen);
$("kop").onclick=()=>{$("pw").select();navigator.clipboard?.writeText($("pw").value)};gen();
</script></body></html>
